<!DOCTYPE html>
<!--
  Makin' It Daily Countdown — GROUPED rank slide (mockup, 2026-10-17).

  WHY: the post now goes out through Instagram's API, which caps a carousel at 10 slides.
  THE RULE (operator, 2026-10-17): if cover + one slide per record + the two closing slides
  fits in 10, every record keeps its own slide. Only when it would exceed 10 do #3, #2 and #1
  keep individual slides and the rest (#N … #4) are GROUPED onto 2–4 slides, as few as needed
  to land on 10 total. 16 records = cover + 4 group slides (3–4 records each) + #3 #2 #1 +
  team + cta = 10. 9 records = cover + #9–#4 (one slide of six, or two of three) + #3 #2 #1 +
  team + cta = 8 (or 9).

  RECOMMENDATION: a group slide holds at most FOUR records. Four rows keep the title at
  52px and the rank at 96px, which still read as a thumbnail in the feed; six rows force the
  title to 40px and the artist + handle onto one 26px line, which is legible full-screen but
  is a wall of text at grid size and nobody's row stands out. Split #9–#4 as two slides of
  three (#9–#7, #7–#4 … i.e. #9–#7 and #6–#4), landing a 9-record day on 9 slides.
  The template renders both densities so they can be judged side by side.

  Same language as countdown.html: Archivo 900 + Space Mono, the 13° ticks and button,
  green = go, GOLD NEVER APPEARS HERE (first place has its own slide). RANK ONLY — no score,
  no average, no vote count. The slide never states the size of the field: the ticks run from
  the group's lowest rank up to #1 (the same device the single rank slides use), so #13 reads
  as "13 from the top", not "4th from the bottom of 16".

    ?lo=16&hi=13        the span, lowest rank first (counts DOWN the slide: #16 at the top)
    &date=YYYY-MM-DD    the day the post goes up
    &r16=Song|Artist|ig overrides a row (artist/ig optional)

  Render (same method as render.sh):
    python3 -m http.server 8781 --bind 127.0.0.1 --directory public/brand &
    Chrome --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1
      --window-size=1080,1350 --virtual-time-budget=20000 --screenshot=group-4.png
      "http://127.0.0.1:8781/countdown/group.html?lo=16&hi=13"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Countdown — group slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
:root{ --ground:#0E0C1A; --panel:#171328; --line:#2E2750; --ink:#EAE9F2; --dim:#9793B4; --green:#4BB749; }
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:var(--ground)}
#c{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'Archivo',system-ui,sans-serif}

/* masthead — identical to the rank slides */
.logo{position:absolute;left:80px;top:80px;height:34px;width:auto}
.date{position:absolute;right:80px;top:78px;font-family:'Space Mono',monospace;font-weight:700;font-size:32px;line-height:38px;color:var(--dim);letter-spacing:.02em}
.series{position:absolute;left:80px;top:142px;font-weight:900;font-size:58px;line-height:1;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap}

/* the countdown ticks: the group's ranks are lit, the run goes to #1, no total is stated */
.ticks{position:absolute;left:84px;top:226px;display:flex}
.tick{display:flex;align-items:center;justify-content:center;width:var(--tw,78px);height:var(--th,46px);border:2px solid var(--line);border-radius:5px;transform:skewX(-13deg)}
.tick span{transform:skewX(13deg);font-family:'Space Mono',monospace;font-weight:700;font-size:var(--tf,22px);color:var(--dim);line-height:1}
.tick.on{background:var(--green);border-color:var(--green)}
.tick.on span{color:var(--ground)}

/* the span: "#16–#13", the same # device as the single slides, scaled to a header */
.span{position:absolute;left:80px;top:306px;display:flex;align-items:baseline;font-family:'Space Mono',monospace;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.04em}
.span .h{font-size:72px;color:var(--green);margin-right:2px}
.span .d{font-size:132px;color:var(--ink)}
.span .dash{align-self:center;width:44px;height:14px;background:var(--dim);border-radius:3px;transform:skewX(-13deg);margin:0 26px 0 22px}

/* rows: rank · title · artist · handle, lowest rank at the top (it counts down) */
.rows{position:absolute;left:80px;right:80px;top:var(--rows-top,460px);bottom:var(--rows-bottom,264px);display:flex;flex-direction:column}
.row{flex:1 1 0;display:flex;align-items:center;gap:28px;border-top:2px solid var(--line);min-height:0}
.row:first-child{border-top:0}
.row .n{flex:none;width:var(--nw,200px);display:flex;align-items:flex-start;font-family:'Space Mono',monospace;font-weight:700;line-height:1;white-space:nowrap;letter-spacing:-.04em}
.row .n .h{font-size:var(--nh,36px);color:var(--green);margin-top:var(--nhm,10px);margin-right:-2px}
.row .n .d{font-size:var(--nd,96px);color:var(--ink)}
.row .t{flex:1 1 auto;min-width:0}
.song{font-weight:900;font-size:var(--sf,52px);line-height:1;letter-spacing:-.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-weight:700;font-size:var(--af,32px);line-height:1.1;letter-spacing:-.02em;margin-top:var(--am,10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ig{font-family:'Space Mono',monospace;font-weight:700;font-size:var(--if,26px);color:var(--dim);margin-top:var(--im,4px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* six-up: tighter rank, title one size down, artist + handle on one line */
#c.d6{--nw:150px;--nd:64px;--nh:28px;--nhm:6px;--sf:40px;--af:26px;--am:8px;--if:24px}
#c.d6 .t .sub{display:flex;align-items:baseline;gap:14px;white-space:nowrap;overflow:hidden}
#c.d6 .artist,#c.d6 .ig{margin-top:0}
#c.d6 .t .sub .artist{margin-top:8px}
#c.d6 .t .sub .ig{margin-top:0;flex:none}

/* the submit strip — identical to the rank slides */
.strip{position:absolute;left:80px;right:80px;bottom:80px;height:150px;border-top:2px solid var(--line);padding-top:30px}
.strip .q{font-weight:900;font-size:36px;line-height:1;letter-spacing:-.03em;text-transform:uppercase}
.strip .u{font-family:'Space Mono',monospace;font-weight:700;font-size:30px;color:var(--dim);margin-top:14px}
.btn{position:absolute;right:10px;bottom:0;background:var(--green);color:var(--ground);transform:skewX(-13deg);border-radius:6px;padding:0 32px;height:72px;display:flex;align-items:center}
.btn span{transform:skewX(13deg);font-weight:900;font-size:34px;letter-spacing:-.03em;text-transform:uppercase;white-space:nowrap}
</style>
</head>
<body>
<div id="c">
  <img class="logo" src="../assets/makinit-logo-white.png" alt="Makin' It">
  <div class="date" id="date"></div>
  <div class="series">Daily Countdown</div>
  <div class="ticks" id="ticks"></div>
  <div class="span" id="span"></div>
  <div class="rows" id="rows"></div>
  <div class="strip">
    <div class="q">Think you should be here?</div>
    <div class="u">makinitmag.com/review</div>
    <div class="btn"><span>Submit free</span></div>
  </div>
</div>
<script>
const q = new URLSearchParams(location.search);
const g = (k, d) => (q.get(k) == null ? d : q.get(k));
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2, '0');
const mmddyy = iso => { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : p2(d.getMonth() + 1) + '.' + p2(d.getDate()) + '.' + String(d.getFullYear()).slice(-2); };

// Sample day — the same placeholders as countdown.html (PLACEHOLDER records, not real artists).
const SAMPLE = {
  4: { song: 'Westside Prayer', artist: 'Dre Calloway', ig: 'drecalloway' },
  5: { song: 'Late Checkout', artist: 'Nia Monroe', ig: 'niamonroe' },
  6: { song: 'Highway 85', artist: 'Marcus Lane', ig: 'marcuslanemusic' },
  7: { song: 'Ask Me Again', artist: 'Sienna Cole', ig: 'siennacole' },
  8: { song: 'No Signal', artist: 'Bryce Holloway', ig: 'brycehollowayofficial' },
  9: { song: 'Mama Said Pray', artist: 'Deja Simone', ig: 'dejasimone' },
  10: { song: 'Cold Front', artist: 'Tre Wallace', ig: 'trewallace' },
  11: { song: 'Overtime', artist: 'Kiana Ross', ig: 'kianarossmusic' },
  12: { song: 'Back Porch Lights', artist: 'Andre Mitchell', ig: 'andremitchell' },
  13: { song: 'Two Left Turns', artist: 'Jordyn Price', ig: 'jordynprice' },
  14: { song: 'Paper Thin', artist: 'Isaiah Grant', ig: '' },            // one row with no handle
  15: { song: 'Different Now', artist: 'Mya Bennett', ig: 'myabennett' },
  16: { song: 'Everything I Never Said Before the Summer Ended (Remix)', artist: 'Cam Rivers', ig: 'camrivers' }, // long title stress
};

const LO = Math.max(4, Math.min(17, parseInt(g('lo', '16'), 10) || 16));   // lowest rank (top row)
const HI = Math.max(4, Math.min(LO, parseInt(g('hi', '13'), 10) || 13));   // highest rank (bottom row); never below #4
const COUNT = LO - HI + 1;
const c = $('c');
if (COUNT >= 5) c.classList.add('d6');
$('date').textContent = mmddyy(g('date', '2026-10-02'));

// Ticks run from the group's lowest rank to #1 — the single rank slides' rule, so the size of the
// field is never stated. Every rank in the group is lit.
(() => {
  const el = $('ticks'), gap = 9, max = 78, h = 46, from = LO;
  const w = Math.min(max, (912 - gap * (from - 1)) / from);
  el.style.gap = gap + 'px';
  el.style.setProperty('--tw', w + 'px');
  el.style.setProperty('--th', Math.min(h, Math.round(w * .95)) + 'px');
  el.style.setProperty('--tf', Math.max(17, Math.min(h * .46, w * .42)) + 'px');
  for (let r = from; r >= 1; r--) {
    const t = document.createElement('div');
    t.className = 'tick' + (r <= LO && r >= HI ? ' on' : '');
    t.innerHTML = '<span>' + p2(r) + '</span>';
    el.appendChild(t);
  }
})();

$('span').innerHTML = '<span class="h">#</span><span class="d">' + LO + '</span><span class="dash"></span><span class="h">#</span><span class="d">' + HI + '</span>';

const rows = $('rows');
for (let r = LO; r >= HI; r--) {
  const o = (g('r' + r, '') || '').split('|');
  const s = SAMPLE[r] || { song: 'Song title', artist: 'Artist', ig: '' };
  const song = o[0] || s.song, artist = o[1] || s.artist, ig = (o.length > 2 ? o[2] : s.ig).replace(/^@/, '');
  const row = document.createElement('div');
  row.className = 'row';
  const igHtml = ig ? '<div class="ig">@' + ig + '</div>' : '';
  row.innerHTML = '<div class="n"><span class="h">#</span><span class="d">' + r + '</span></div>' +
    '<div class="t"><div class="song">“' + song + '”</div>' +
    (COUNT >= 5 ? '<div class="sub"><div class="artist">' + artist + '</div>' + igHtml + '</div>'
                : '<div class="artist">' + artist + '</div>' + igHtml) + '</div>';
  rows.appendChild(row);
}

// Fit: a title that overflows its line steps down to a floor; on the four-up there is room for
// a second line, so past the floor it wraps instead of truncating. Six-up truncates (no room).
document.fonts.ready.then(() => requestAnimationFrame(() => {
  const base = COUNT >= 5 ? 40 : 52, floor = COUNT >= 5 ? 30 : 40;
  document.querySelectorAll('.song').forEach(el => {
    let fits = false;
    for (let fs = base; fs >= floor; fs -= 2) { el.style.fontSize = fs + 'px'; if (el.scrollWidth <= el.clientWidth) { fits = true; break; } }
    if (!fits && COUNT < 5) { el.style.whiteSpace = 'normal'; el.style.fontSize = '36px'; el.style.lineHeight = '.95'; }
  });
}));
document.title = 'Daily Countdown — #' + LO + '–#' + HI;
</script>
</body>
</html>
