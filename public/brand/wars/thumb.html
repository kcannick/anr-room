<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A&amp;R Wars — livestream thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
/* ============================================================
   A&R Wars — the thumbnail, 1920x1080, in the same weekly structure as the flyers: the big
   slot (that week's qualifier) top right, the eight seats along the bottom with unfilled
   seats as numbered silhouettes, the lockup, the date and the $500 on the left.

     ?filled=N (1..8) · ?stage=final · ?stage=champion   (see flyer-feed.html)

   Designed for 180px wide (a sidebar, the subscriptions row). What survives there: the
   lockup, the big face (or the question mark), the $500, the date, and a row of eight
   circles. The names are set small on purpose. No full-bleed cut behind type at this size —
   the block carries the device. Colour: purple = the contest, gold = $500 and the champion,
   green = LIVE and the date. Flex + absolute boxes only.
   ============================================================ */
:root{ --ground:#0E0C1A; --panel:#171328; --line:#2E2750; --ink:#EAE9F2; --dim:#9793B4; --green:#4BB749; --purple:#6D5FE0; --gold:#F5C518; }
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:var(--ground)}
#c{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;--pad:96px}

.logo{position:absolute;left:var(--pad);top:64px;height:40px;width:auto}
.num{position:absolute;left:var(--pad);top:124px;font-family:'Space Mono',monospace;font-weight:700;font-size:30px;line-height:1;color:var(--dim);letter-spacing:.02em}
.lock{position:absolute;left:var(--pad);top:180px;display:flex;align-items:center;height:220px;--S:220px}
.lock img{height:var(--S);width:auto;flex:none}
.lock .w{font-weight:900;font-size:calc(var(--S) * .9375);line-height:1;letter-spacing:-.04em;text-transform:uppercase;margin-left:calc(var(--S) * .16);color:var(--ink);white-space:nowrap}
/* the date, green */
.when{position:absolute;left:var(--pad);top:440px;font-family:'Space Mono',monospace;font-weight:700;font-size:56px;line-height:1;color:var(--green);letter-spacing:-.03em;white-space:nowrap;display:flex;align-items:center}
.when .live{display:inline-block;background:var(--green);color:var(--ground);transform:skewX(-13deg);border-radius:6px;padding:0 20px;height:64px;line-height:64px;font-size:36px;letter-spacing:.08em;margin-right:24px}
.when .live span{display:inline-block;transform:skewX(13deg)}
/* the headline */
.head{position:absolute;left:var(--pad);top:530px;font-weight:900;font-size:76px;line-height:1;letter-spacing:-.04em;white-space:nowrap}
.head b{color:var(--gold)}
/* the money, gold, on the left under the headline (qualifier weeks); the final asks the question instead */
.money{position:absolute;left:var(--pad);top:620px;display:flex;align-items:baseline;gap:22px;color:var(--gold);font-family:'Space Mono',monospace;font-weight:700;font-size:120px;line-height:1;letter-spacing:-.06em}
.money small{font-size:34px;letter-spacing:.1em;text-transform:uppercase}
.premise{position:absolute;left:var(--pad);top:752px;width:1240px;font-weight:500;font-size:28px;line-height:1.3;color:var(--ink);letter-spacing:-.01em}
.champion .money{display:none}
.champion .premise{top:640px}

/* the big slot, top right: photo, then the person under it */
.big{position:absolute;right:var(--pad);top:96px;width:460px;display:flex;flex-direction:column;align-items:center}
.big .ph{position:relative;width:420px;height:420px;border-radius:50%;overflow:hidden;background:var(--panel);flex:none}
.big .ph img{position:absolute;left:0;top:0;width:420px;height:420px;object-fit:cover}
.big .ph .qm{position:absolute;left:0;top:0;width:420px;height:420px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:280px;line-height:1;color:var(--purple)}
.big .nm{margin-top:22px;font-weight:900;font-size:48px;line-height:1;letter-spacing:-.04em;white-space:nowrap;text-align:center}
.big .ig{margin-top:10px;display:flex;align-items:center;gap:8px;font-family:'Space Mono',monospace;font-weight:700;font-size:26px;line-height:1;color:var(--dim);white-space:nowrap}
.big .ig:empty{display:none}
.big .ig .igi{width:28px;height:28px;flex:none}
.big .tag{margin-top:16px;background:var(--purple);color:var(--ink);transform:skewX(-13deg);border-radius:4px;padding:0 18px;height:42px;line-height:42px;font-weight:900;font-size:22px;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap}
.big .tag span{display:inline-block;transform:skewX(13deg)}
.final .big .ph{border:5px dashed var(--purple)}
.final .big .nm,.final .big .ig,.final .big .tag{display:none}
.champion .big .ph{outline:10px solid var(--gold)}
.champion .big .nm{color:var(--gold)}
.champion .big .tag{background:var(--gold);color:var(--ground)}

/* the eight seats along the bottom */
.seats{position:absolute;left:var(--pad);right:var(--pad);bottom:56px;display:flex;justify-content:space-between}
.seat{width:190px;display:flex;flex-direction:column;align-items:center;position:relative}
.seat .ph{position:relative;width:150px;height:150px;border-radius:50%;overflow:hidden;background:var(--panel);flex:none}
.seat .ph img{position:absolute;left:0;top:0;width:150px;height:150px;object-fit:cover}
.seat .ph svg{position:absolute;left:0;top:0;width:150px;height:150px}
.seat .nm{margin-top:12px;font-weight:800;font-size:24px;line-height:1;letter-spacing:-.03em;white-space:nowrap;text-align:center}
.seat.empty .ph{border:3px dashed var(--line)}
.seat.empty .nm{font-family:'Space Mono',monospace;font-weight:700;font-size:20px;color:var(--dim);letter-spacing:.02em}
.seat.star .ph{outline:5px solid var(--purple)}
.champion .seat.star .ph{outline-color:var(--gold)}
.champion .seat.star .nm{color:var(--gold)}
</style>
</head>
<body>
<div id="c">
  <img class="logo" src="../assets/makinit-logo-white.png" alt="Makin' It">
  <div class="num" id="num"></div>
  <div class="lock"><img src="../mark/anr-mark-purple.svg" alt="A&amp;R"><span class="w">Wars</span></div>
  <div class="when" id="when"></div>
  <div class="head" id="head"></div>
  <div class="money" id="money"></div>
  <div class="premise" id="premise"></div>
  <div class="big" id="big"></div>
  <div class="seats" id="seats"></div>
</div>
<script>
/* ---- DATA: the same block sits at the top of flyer-feed, flyer-story and thumb so the three
   cannot disagree. PLACEHOLDERS: every competitor is invented, the photos are pravatar stand-ins.
   `competitors` are the SEATS in the order they qualified (seat 1 = week 1). `winner` is a seat
   number (1..8) or null. `week` is the label printed on that seat's flyer (defaults to "Week N"). ---- */
const DATA = {
  name: 'A&R Wars', number: '#1', date: 'Sunday, October 25', time: '7:00 PM ET',
  prize: '$500 Cash Prize', watch: 'makinitmag.com/ANR',
  competitors: [
    { name: 'Taliyah Rae',    handle: 'taliyahrae',      city: 'Atlanta, GA',     photo: 'https://i.pravatar.cc/300?img=47' },
    { name: 'Marcus Lane',    handle: 'marcuslanemusic', city: 'Houston, TX',     photo: 'https://i.pravatar.cc/300?img=12' },
    { name: 'Deja Simone',    handle: 'dejasimone',      city: 'Chicago, IL',     photo: 'https://i.pravatar.cc/300?img=32' },
    { name: 'Bryce Holloway', handle: '',                city: 'Charlotte, NC',   photo: 'https://i.pravatar.cc/300?img=52' },
    { name: 'Nia Monroe',     handle: 'niamonroe',       city: 'Memphis, TN',     photo: 'https://i.pravatar.cc/300?img=25' },
    { name: 'Andre Mitchell', handle: 'andremitchell',   city: 'Detroit, MI',     photo: 'https://i.pravatar.cc/300?img=60' },
    { name: 'Kiana Ross',     handle: 'kianarossmusic',  city: 'Los Angeles, CA', photo: 'https://i.pravatar.cc/300?img=44' },
    { name: 'Jordyn Price',   handle: 'jordynprice',     city: 'Brooklyn, NY',    photo: 'https://i.pravatar.cc/300?img=16' },
  ],
  winner: 3,
};
const q = new URLSearchParams(location.search);
const STAGE = q.get('stage') === 'final' ? 'final' : q.get('stage') === 'champion' ? 'champion' : 'week';
const FILLED = STAGE === 'week' ? Math.max(1, Math.min(8, parseInt(q.get('filled') || '1', 10) || 1)) : 8;
const seat = n => DATA.competitors[n - 1];
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const handleOf = c => (c && c.handle ? '@' + String(c.handle).replace(/^@/, '') : '');
const weekOf = n => (seat(n) && seat(n).week) || ('Week ' + n);
const STAR = STAGE === 'week' ? FILLED : STAGE === 'champion' ? DATA.winner : null;
const IG_SVG = '<svg class="igi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>';
const SIL = '<svg viewBox="0 0 100 100" fill="none" stroke="#9793B4" stroke-width="3" stroke-linecap="round"><circle cx="50" cy="38" r="17"/><path d="M19 96c3-20 16-30 31-30s28 10 31 30"/></svg>';
const PREMISE = '8 A&Rs play the songs they scouted. You vote on every matchup. The winner takes the cash prize.';   // operator's premise line; "the cash prize" here so the $500 prints ONCE per graphic (the field block, or the champion headline)
/* ---- end DATA ---- */

const $ = id => document.getElementById(id);
const c = $('c'); c.className = STAGE;
const star = STAR ? seat(STAR) : null;
$('num').textContent = DATA.name + ' ' + DATA.number;
$('when').innerHTML = (STAGE === 'champion' ? '' : '<span class="live"><span>LIVE</span></span>') + esc(DATA.date) + ' · ' + esc(DATA.time);
$('head').innerHTML = STAGE === 'week' ? esc(star.name) + ' qualified.'
  : STAGE === 'final' ? 'Who has the Best Ear?'   // operator's wording, verbatim
  : esc(star.name) + ' wins <b>$500</b>.';
$('premise').textContent = PREMISE;
$('money').innerHTML = esc(DATA.prize.split(' ')[0]) + '<small>' + esc(DATA.prize.split(' ').slice(1).join(' ')) + '</small>';

if (star) {
  const tag = STAGE === 'champion' ? 'Champion' : 'Qualified · ' + weekOf(STAR);   // the champion headline carries the one $500
  $('big').innerHTML = `<div class="ph"><img src="${esc(star.photo)}" alt=""></div>
    <div class="nm">${esc(star.name)}</div>
    <div class="ig">${star.handle ? IG_SVG + esc(handleOf(star)) : ''}</div>
    <div class="tag"><span>${esc(tag)}</span></div>`;
} else {
  $('big').innerHTML = `<div class="ph"><div class="qm">?</div></div>`;
}
$('seats').innerHTML = [1, 2, 3, 4, 5, 6, 7, 8].map(n => {
  const p = n <= FILLED ? seat(n) : null;
  if (!p) return `<div class="seat empty"><div class="ph">${SIL}</div><div class="nm">Seat ${n}</div></div>`;
  return `<div class="seat${n === STAR ? ' star' : ''}"><div class="ph"><img src="${esc(p.photo)}" alt=""></div><div class="nm">${esc(p.name)}</div></div>`;
}).join('');

const fit = (el, max, min) => { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > max && fs > min) { fs -= 1; el.style.fontSize = fs + 'px'; } };
document.fonts.ready.then(() => requestAnimationFrame(() => {
  fit($('head'), 1260, 40);                     // stops short of the big slot (x = 1364)
  for (const el of document.querySelectorAll('.big .nm, .big .ig')) fit(el, 460, 24);
  for (const el of document.querySelectorAll('.seat .nm')) fit(el, 200, 14);
}));
document.title = 'A&R Wars — thumbnail — ' + (STAGE === 'week' ? 'week ' + FILLED : STAGE);
</script>
</body>
</html>
