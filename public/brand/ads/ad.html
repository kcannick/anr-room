<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A&amp;R brand ad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Space+Mono:wght@400;700&display=block" rel="stylesheet">
<style>
/* ============================================================
   The four brand ads — stage 2 of the promo build order.

     ?ad=join|submit|watch|pack   one audience, one ask, one button
     ?f=feed|story                1080x1350 or 1080x1920
     ?price=...                   pack only; default is the operator's line (2026-09-11)

   One template, four configs, so the four can never drift. The lockups
   and the block come from ../lockups and ../mark — never redrawn here.

   Layout rule from the brand skill: the big 13° cut does the work at
   thumbnail size, and NO type ever straddles it — the headline and body
   sit entirely on the ground, the call to action entirely on the field.
   ============================================================ */
:root{ --ground:#0E0C1A; --ink:#EAE9F2; --dim:#9793B4; --green:#4BB749; --purple:#6D5FE0; --gold:#F5C518; }
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:var(--ground)}
#c{position:relative;overflow:hidden;background:var(--ground);color:var(--ink);font-family:'Archivo',system-ui,sans-serif}
#c.feed{width:1080px;height:1350px}
#c.story{width:1080px;height:1920px}

.logo{position:absolute;left:72px;height:40px;width:auto}
.feed .logo{top:72px}
.story .logo{top:250px}

.lock{position:absolute;left:0;height:280px;width:auto}  /* svg carries .5S clear space on each side; S=140 */
.feed .lock{top:130px}
.story .lock{top:330px}
.lock.small{height:200px}                                   /* S=100: SERVICE PACK is the long one */
.feed .lock.small{top:170px}
.story .lock.small{top:370px}

.head{position:absolute;left:72px;right:72px;font-weight:900;font-size:118px;line-height:.92;letter-spacing:-.04em;text-wrap:balance}
.feed .head{top:430px}
.story .head{top:700px;font-size:var(--head-story,124px)}
.head.big{font-size:150px}
.story .head.big{font-size:168px}

.body{position:absolute;left:72px;right:72px;font-weight:500;font-size:40px;line-height:1.28;color:var(--ink);max-width:var(--body-width,800px)}
.body p{margin:0} .body p + p{margin-top:.55em}
.feed .body{top:var(--body-top,720px);font-size:var(--body-size,40px)}
.story .body{top:var(--body-top-story,1040px);font-size:var(--body-size-story,46px);max-width:var(--body-width-story,880px)}
.body b{font-weight:900;color:var(--gold)}       /* gold: money only */
.head b{color:var(--gold)}
/* the audience line: Space Mono, uppercase, the 13° tick (operator's Submit copy, 2026-09-18) */
.eyebrow{position:absolute;left:72px;right:72px;font-family:'Space Mono',monospace;font-weight:700;font-size:28px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.eyebrow::before{content:'';display:inline-block;width:.32em;height:.85em;background:var(--fill,var(--green));transform:skewX(-13deg);margin-right:.5em;vertical-align:-.06em}
.feed .eyebrow{top:var(--eyebrow-top,450px)}
.story .eyebrow{top:var(--eyebrow-top-story,700px);font-size:30px}
.feed .head{top:var(--head-top,430px);font-size:var(--head-feed,118px)}
.story .head{top:var(--head-top-story,700px)}
.body .mono{font-family:'Space Mono',monospace;font-weight:700}

/* the cut: a full-bleed field whose top edge rises to the right at 13° */
.field{position:absolute;left:0;right:0;bottom:0;background:var(--fill,var(--green));
  clip-path:polygon(0 var(--cut-l), 100% var(--cut-r), 100% 100%, 0 100%)}
.feed .field{height:500px;--cut-l:260px;--cut-r:11px}     /* 1080 * tan13 = 249 */
.story .field{height:720px;--cut-l:300px;--cut-r:51px}

.cta{position:absolute;left:72px;color:var(--ground);font-weight:900;font-size:56px;line-height:1;letter-spacing:-.03em}
.cta small{display:block;font-family:'Space Mono',monospace;font-weight:700;font-size:26px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px;opacity:.85}
.feed .cta{bottom:96px}
.story .cta{bottom:300px}     /* above the reply bar */
.cta .url{font-family:'Space Mono',monospace;font-weight:700;font-size:44px;letter-spacing:-.01em;margin-top:14px;display:block}
</style>
</head>
<body>
<div id="c">
  <img class="logo" src="../assets/makinit-logo-white.png" alt="Makin' It">
  <img class="lock" id="lock" alt="">
  <div class="head" id="head"></div>
  <div class="eyebrow" id="eyebrow"></div>
  <div class="body" id="body"></div>
  <div class="field"></div>
  <div class="cta" id="cta"></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const AD = q.get('ad') || 'join';
const F  = q.get('f') === 'story' ? 'story' : 'feed';
const PRICE = q.get('price') || '$49';

/* Copy is plain and direct (brand skill). No slang, no exclamation marks.
   Where the operator has supplied wording it is used verbatim. */
const ADS = {
  join: {   // 1.1 / 1.2 — every recruiting ad uses the word Team
    lock: 'anr-team-h', fill: 'var(--green)',
    head: 'Join the A&amp;R Team.',
    body: 'Help pick the artists we book for shows, interviews, and playlist placements. <b>$500</b> to the month’s Top A&amp;R.',   // operator's wording, verbatim (2026-09-13)
    cta:  'Join the team', url: 'makinitmag.com/ANR',
  },
  submit: { // 4.1 / 4.2 — the Meeting flyer. Operator's four lines, verbatim (2026-09-18); the
            // descriptive body of 2026-09-13 is gone. Never placement, never the pack. Gold on the money only.
    lock: 'anr-meeting-h', fill: 'var(--green)',
    eyebrow: 'Artist, Producers, &amp; Songwriters',   // operator, 2026-09-18
    head: 'Win <b>$1,000</b><br>Promo budget',
    body: '',
    cta:  'Submit for Free', url: 'makinitmag.com/review',
    eyebrowTop: 450, headTop: 510, headFeed: 132, eyebrowTopStory: 700, headTopStory: 770, headStory: 132,
  },
  watch: {  // 2.2 — the day and the time. Nothing else.
    lock: 'anr-room-h', fill: 'var(--green)', big: true,
    head: 'Wednesday.<br>7PM ET.',
    body: 'Live music review.',
    cta:  'Watch live', url: 'makinitmag.com/live',
  },
  pack: {   // 3.1 / 3.2 — what it is, what it costs, where it goes. Never mentions scores.
    lock: 'anr-service-pack-h', fill: 'var(--purple)',
    head: 'Break Your Record',
    body: 'The A&amp;R Service Pack is a monthly campaign distributing new records to over <span class="mono">30,000</span> industry contacts. Placements start at <span class="mono">' + PRICE + '</span> (for a limited time).',   // operator's wording, verbatim (revised 2026-09-13)
    cta:  'Get placement', url: 'makinitmag.com/packs',
    bodyTop: 690, bodyTopStory: 1000, small: true, headStory: 112,
  },
}[AD];

const c = document.getElementById('c');
c.className = F;
c.style.setProperty('--fill', ADS.fill);
if (ADS.headStory) c.style.setProperty('--head-story', ADS.headStory + 'px');
if (ADS.headFeed) c.style.setProperty('--head-feed', ADS.headFeed + 'px');
if (ADS.headTop) { c.style.setProperty('--head-top', ADS.headTop + 'px'); c.style.setProperty('--head-top-story', ADS.headTopStory + 'px'); }
if (ADS.eyebrowTop) { c.style.setProperty('--eyebrow-top', ADS.eyebrowTop + 'px'); c.style.setProperty('--eyebrow-top-story', ADS.eyebrowTopStory + 'px'); }
if (ADS.bodyTop) { c.style.setProperty('--body-top', ADS.bodyTop + 'px'); c.style.setProperty('--body-top-story', ADS.bodyTopStory + 'px'); }
if (ADS.bodySize) { c.style.setProperty('--body-size', ADS.bodySize + 'px'); c.style.setProperty('--body-size-story', ADS.bodySizeStory + 'px'); }
if (ADS.bodyWidth) c.style.setProperty('--body-width', ADS.bodyWidth + 'px');
if (ADS.bodyWidthStory) c.style.setProperty('--body-width-story', ADS.bodyWidthStory + 'px');
const lock = document.getElementById('lock');
lock.src = '../lockups/' + ADS.lock + '.svg'; if (ADS.small) lock.classList.add('small');
const head = document.getElementById('head');
head.innerHTML = ADS.head; if (ADS.big) head.classList.add('big');
document.getElementById('body').innerHTML = ADS.body;
document.getElementById('eyebrow').innerHTML = ADS.eyebrow || '';
document.getElementById('cta').innerHTML = ADS.cta + '<span class="url">' + ADS.url + '</span>';
document.title = 'A&R ad — ' + AD + ' — ' + F;
</script>
</body>
</html>
